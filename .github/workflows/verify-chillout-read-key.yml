# MIDLERTIDIG. Slettes nar den har bestatt en gang.
#
# Verifiserer at CHILLOUT_READ_KEY, slik den faktisk ligger lagret som
# repository secret, autentiserer mot Chillouts lesekontrakt -- og at den
# IKKE nar en annen Property.
#
# Hvorfor her og ikke manuelt: forbrukeren av nokkelen ER GitHub Actions. En
# manuell test ville testet en kopi noen limte inn for hand, og klartekst-
# nokkelen finnes ikke lenger noe sted (databasen har bare hashen, og en
# repository secret kan ikke leses tilbake). Dette er den eneste maten a
# teste den lagrede verdien pa.
#
# Bygger ingenting, deployer ingenting, sjekker ikke ut repoet, sender ingen
# /go/-forespørsel og ingen leverandør-trafikk. To GET-er, statuskoder ut.

name: Verifiser Chillout-lesenokkel (midlertidig)

on:
  # Kun manuell. Ingen push, ingen schedule -- den kan ikke kjøre av seg selv.
  workflow_dispatch: {}

# Ingen rettigheter. Jobben leser ingenting i repoet og skriver ingenting.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: To lesekall, kun statuskoder
        env:
          # Secreten gar inn som miljøvariabel, aldri som argument: et
          # argument er synlig i prosesslista, en miljøvariabel er det ikke.
          # GitHub maskerer den i loggen uansett, men ingenting her er
          # avhengig av det -- verdien leses en gang og skrives aldri ut.
          CHILLOUT_READ_KEY: ${{ secrets.CHILLOUT_READ_KEY }}
          ORIGIN: https://backoffice-test-d71d.up.railway.app
          PRODUCT: prd_01M2ZP0SREXS63NNMW6YBKRZ9S
        run: |
          python3 - <<'PY'
          import os, sys, urllib.error, urllib.request

          key = os.environ.get("CHILLOUT_READ_KEY", "")
          if not key:
              # Ikke en autentiseringsfeil -- secreten finnes ikke. Verdt a
              # skille, ellers leter noen etter en nokkel som aldri ble lagt inn.
              print("CHILLOUT_READ_KEY er ikke satt pa dette repoet")
              sys.exit(1)

          # Den interne produktruta med en platform-id vi vet er gyldig.
          # Katalogruta ville krevd at aliaset finnes, og et manglende alias
          # svarer 404 -- som ville sett ut som en feil pa nokkelen.
          url = os.environ["ORIGIN"] + "/api/v1/properties/{}/products/" + os.environ["PRODUCT"] + "/offers"
          expected = [("kontaktlinser-no", 200), ("apotekvarer-no", 403)]

          failures = []
          for prop, want in expected:
              request = urllib.request.Request(
                  url.format(prop), headers={"authorization": "Bearer " + key}
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      got = response.status
              except urllib.error.HTTPError as refusal:
                  got = refusal.code
              except Exception as error:
                  # Typen, aldri meldingen: en nettverksfeil kan inneholde
                  # forespørselen, og forespørselen inneholder headeren.
                  print(f"{prop} -> forespørselen feilet: {type(error).__name__}")
                  failures.append(prop)
                  continue
              print(f"{prop} -> {got} (forventet {want})")
              if got != want:
                  failures.append(prop)

          if failures:
              print("::error::Lesenokkelen oppforte seg ikke som forventet: "
                    + ", ".join(failures))
              sys.exit(1)
          print("Begge forventningene holdt.")
          PY
