name: Oppdater priser og bygg siden

on:
  schedule:
    # Daglig (fra 2026-09-26, var hver 6. time). Feedene (Tradedoubler) ser ut
    # til å oppdateres ca. 22:15-22:20 UTC, og GitHub forsinker cron med
    # timer -- 22:45 UTC lander etter feed-oppdateringen og før norsk morgen.
    # Skraping gjøres ca. annenhver dag, se KL_SKIP_FRESH_SCRAPE under.
    - cron: "45 22 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Nødvendig for at jobben skal ha lov til å publisere til GitHub Pages
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Hent priser (feeds + scraping) og bygg katalog
        # Kun på den faste timeren (og manuell kjøring) -- IKKE på hver push.
        # En vanlig kode-/designendring trenger ikke fersk skraping, og skal
        # ikke legge unødig, gjentatt last på forhandlernes servere. Endrer
        # du products_meta.json/sources_config.json (nye produkter/
        # forhandlere), kjør build_catalog.py lokalt og committ resultatet
        # (site_generator/catalog_live.json) sammen med endringen, slik
        # praksis har vært hele denne økten.
        if: github.event_name != 'push'
        env:
          # Kun den planlagte kjøringen får gjenbruke skrapede priser som er
          # yngre enn ~36 t (build_catalog.py, SCRAPE_MAX_AGE_HOURS) -- feedene
          # hentes alltid friskt. Manuell kjøring (workflow_dispatch) og lokal
          # kjøring skraper alltid fullt.
          KL_SKIP_FRESH_SCRAPE: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python3 build_catalog.py

      - name: Lagre oppdatert prisdata tilbake til repoet
        # KRITISK: uten dette steget forsvinner hver fersk skraping igjen
        # ved neste push - push-bygg bruker catalog_live.json SLIK DEN LIGGER
        # I GIT (skraper ikke selv, se steget over), så uten en commit her
        # blir enhver kode-/designendring en utilsiktet "gjenopprett gårsdagens
        # priser"-handling. Fant og fikset 2026-08-11 etter at nettopp dette
        # skjedde gjentatte ganger i løpet av en økt med mange pushes.
        # [skip ci] hindrer at denne commiten trigger enda en kjøring.
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site_generator/catalog_live.json
          git diff --staged --quiet || git commit -m "Oppdater catalog_live.json med ferske priser [skip ci]"
          git pull --rebase origin main
          git push

      - name: Generer statiske sider
        env:
          # Chillouts lesenokkel. Uten denne linja ser generatoren den ikke i
          # det hele tatt -- en secret er ikke automatisk tilgjengelig for et
          # steg -- og /go/-lenken ville stille forsvunnet fra det konverterte
          # kortet ved neste bygg. GitHub maskerer verdien i loggen; koden
          # skriver den uansett aldri ut.
          CHILLOUT_READ_KEY: ${{ secrets.CHILLOUT_READ_KEY }}
          # Ikke en secret: originet er ikke hemmelig, og en secret ville
          # blitt maskert i loggen der den nettopp er det man vil se. En
          # repository VARIABLE, sa a flytte API-et er a endre en verdi.
          CHILLOUT_ORIGIN: ${{ vars.CHILLOUT_ORIGIN }}
        run: python3 site_generator/generate_pages.py site_generator/catalog_live.json

      - name: Lagre oppdatert prishistorikk tilbake til repoet
        # generate_pages.py skriver dagens laveste pris til
        # site_generator/price_history.json ved HVER kjøring (også push,
        # siden dette steget kjører uansett event-type) -- uten en commit
        # her forsvinner historikken igjen ved neste checkout, samme
        # problem som catalog_live.json hadde før 2026-08-11-fiksen.
        # [skip ci] hindrer at denne commiten trigger enda en kjøring.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site_generator/price_history.json
          git diff --staged --quiet || git commit -m "Oppdater price_history.json [skip ci]"
          git pull --rebase origin main
          git push

      - name: Valider bygget
        run: python3 site_generator/validate_build.py

      - name: Legg til robots.txt, llms.txt, sitemap og eierskapsverifiseringer i output
        # Disse ligger i repo-roten, ikke generert av generate_pages.py,
        # men skal likevel med i det som faktisk publiseres.
        run: |
          cp robots.txt site_generator/build/robots.txt
          cp llms.txt site_generator/build/llms.txt
          cp sitemap*.xml site_generator/build/
          cp google*.html site_generator/build/ 2>/dev/null || true
          cp commission-factory*.html site_generator/build/ 2>/dev/null || true

      - name: Publiser til GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_generator/build
          cname: kontaktlinser.no
