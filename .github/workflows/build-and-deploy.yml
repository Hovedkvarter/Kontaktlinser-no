name: Oppdater priser og bygg siden

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

# Nødvendig for at jobben skal ha lov til å publisere til GitHub Pages
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Hent priser (feeds + scraping) og bygg katalog
        # Kun på den faste timeren (og manuell kjøring) -- IKKE på hver push.
        # En vanlig kode-/designendring trenger ikke fersk skraping, og skal
        # ikke legge unødig, gjentatt last på forhandlernes servere. Endrer
        # du products_meta.json/sources_config.json (nye produkter/
        # forhandlere), kjør build_catalog.py lokalt og committ resultatet
        # (site_generator/catalog_live.json) sammen med endringen, slik
        # praksis har vært hele denne økten.
        if: github.event_name != 'push'
        run: python3 build_catalog.py

      - name: Generer statiske sider
        run: python3 site_generator/generate_pages.py site_generator/catalog_live.json

      - name: Valider bygget
        run: python3 site_generator/validate_build.py

      - name: Legg til robots.txt, llms.txt, sitemap og eierskapsverifiseringer i output
        # Disse ligger i repo-roten, ikke generert av generate_pages.py,
        # men skal likevel med i det som faktisk publiseres.
        run: |
          cp robots.txt site_generator/build/robots.txt
          cp llms.txt site_generator/build/llms.txt
          cp sitemap*.xml site_generator/build/
          cp google*.html site_generator/build/ 2>/dev/null || true
          cp aspxtest.aspx site_generator/build/ 2>/dev/null || true

      - name: Publiser til GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_generator/build
          cname: kontaktlinser.no
